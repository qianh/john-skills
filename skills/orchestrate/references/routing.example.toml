# 路由。模型别名对应 models.conf。改完不用重启，下次 orch run 即生效。

[triage]
# 主控是哪一档时，外派门槛有多高。主控自己判断，这里只是起点。
sonnet = "high"
opus = "low"

[roles.plan]
model = "opus-5.5"
effort = "medium"
explore = { model = "haiku-5.5", effort = "low" }
fallback = ["gpt-6.1-sol"]

[roles.exec]
effort = "high"
default_pool = "standard"
# 一次运行只从方案给出的那一档里选一个模型，选完不换，除非这个模型调用失败。
pool.mechanical = ["glm-5.3-flash", "deepseek-v4.1-flash", "haiku-5.5"]
pool.standard = ["grok-4.7", "sonnet-5.5"]
pool.hard = ["gpt-6.1-sol"]

[roles.review]
model = "gpt-6.1-sol"
effort = "xhigh"
# 执行模型也是 gpt 时改用这里，思考程度用 fallback_effort。
fallback = ["opus-5.5"]
fallback_effort = "medium"
max_rounds = 2
