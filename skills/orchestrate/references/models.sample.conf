# models.conf — 模型别名 × Provider → 该 Provider 下的模型参数
#
# 每行: <别名> <provider> <模型参数> [输入$/M 输出$/M 缓存读$/M 缓存写$/M]
# 同一别名的第一行是默认外壳，后面的行是兜底。价格可以不写。
# 下面的 ID 按 2026-10-25 这台机器实测过的写法。codex 的 ChatGPT 登录跑不了这些模型，所以没有放进来。

# opus 这一行的价格是方案里的示例（美元 / 百万 token），不是这台机器的实测价。只用来估算「全程用 opus 大约多少」。
opus-5.5            claude  claude-opus-5-5            5  25  0.5  6.25
opus-5.5            pi      magpie/claude/claude-opus-5-5

sonnet-5.5          claude  claude-sonnet-5-5

haiku-5.5           claude  claude-haiku-5-5
haiku-5.5           pi      magpie/claude/claude-haiku-5-5

# 2026-10-25 这台机器上，pi 和 grok 调这个 id 都回 400：Copilot 不支持该模型。
# pi 失败很快；grok 这一行仍保留，因为 pi 不能执行，hard 池只有这个外壳可试。review 会再试一次然后落到 opus。
gpt-6.1-sol         pi      magpie/copilot/gpt-6.1-sol
gpt-6.1-sol         grok    magpie/copilot/gpt-6.1-sol

grok-4.7            grok    magpie/grok/grok-4.7

glm-5.3-flash       grok    magpie/zhipu/glm-5.3-flash
glm-5.3-flash       pi      magpie/zhipu/glm-5.3-flash

deepseek-v4.1-flash grok    magpie/workbuddy-ai/deepseek-v4.1-flash
deepseek-v4.1-flash pi      magpie/workbuddy-ai/deepseek-v4.1-flash

grok-4.7-build-fast grok    magpie/grok/grok-4.7-build-fast
