# models.conf — 模型别名 × Provider → 该 Provider 下实际使用的模型参数
#
# 每行三列（空白分隔）:  <别名>  <provider>  <模型参数>
#   别名      routing.md 里引用的名字，自己起，不含空格
#   provider  claude | codex | grok | pi
#   模型参数  原样传给该 provider 的模型选项（claude/codex 的 -m / --model，grok 的 -m，pi 的 --model）
#             各家写法不同，用 `config.sh detect` 查本机真实可用的 ID，不要猜
#
# 同一别名的多行 = 它能在哪些 provider 上跑；**第一行是默认外壳**，其余是兜底。
# 没有对应行的组合，dispatch.sh 会直接报错，不会擅自猜 ID。
# 这是一份示例（作者的网关环境），请按自己的环境改写；改完用 `config.sh check --probe` 实测。

opus-5.5            claude  claude-opus-5-5
opus-5.5            pi      magpie/claude/claude-opus-5-5

sonnet-5.5          claude  claude-sonnet-5-5
sonnet-5.5          codex   claude/claude-sonnet-5-5

gpt-6.1-sol         codex   dzg/gpt-6.1-sol
gpt-6.1-sol         claude  dzg/gpt-6.1-sol

grok-4.7            grok    magpie/grok/grok-4.7
grok-4.7            pi      magpie/grok/grok-4.7

glm-5.3-flash       pi      magpie/zhipu/glm-5.3-flash
glm-5.3-flash       grok    magpie/zhipu/glm-5.3-flash

deepseek-v4.1-flash pi      magpie/group/auto-deepseek-v4-1-flash
deepseek-v4.1-flash grok    magpie/group/auto-deepseek-v4-1-flash
deepseek-v4.1-flash codex   group/auto-deepseek-v4-1-flash
