# registry.yaml — 节点登记表（跨执行器差异沉淀于此）
#
# 约束：
# - 不允许 method 类型；spec skill 不再提供框架内置节点方法兜底。
# - invocations 按优先级探测；都不可用且未选择允许的 native agent 模式时，节点 blocked: install_required。
# - install 指向 references/install.md 中的安装项。用户在 Gate 1 选择安装后，自动核实、安装、验证。
# - subagent.supported=true 的节点必须在 Gate 1 让用户选择 subagent 或 current-agent。
# - auxiliary:true 的候选为补充/备选风味，不抢占主绑定的探测优先级（始终排在主绑定之后）。

execution_kinds:
  - skill
  - tool
  - agent

execution_modes:
  - current-agent
  - subagent
  # CC 另支持 fork 型子代理（继承主会话全上下文；模型注入对 fork 无效，恒随主模型）。

# ── 模型分层（Advisor/Executor 角色固定，执行器映射在 executor_model_map）──
model_tiers:
  advisor:         tier_high   # 分析/规格/审查节点
  executor:        tier_mid    # 实现节点
  executor_risk_H: tier_high   # 风险H时 executor 升格与 advisor 同级

# 模型时效性：模型名随发布演进会过时（本表核实于 2026-07-05）。
# Gate 1 呈现模型分层前，若编排器已知有更新一代可用模型，必须提示用户校准，不得照本宣科。
executor_model_map:
  claude-code:
    tier_high: fable        # Claude Fable 5（Mythos 级，高于 Opus）；环境不支持时回退 opus
    tier_mid:  sonnet       # Sonnet 5
  codex:
    tier_high: gpt-5.5      # 最强复杂编码模型（gpt-5.2 / o3 系已弃用）
    tier_mid:  gpt-5.4      # 旗舰默认档；gpt-5.4-mini 仅适合轻量探查子代理，不承担 N5 实现
  # 新执行器：在此追加一个 block，SKILL.md 逻辑无需改动

# ── 模型直通覆写（framework-free bypass）──
# 主 agent 模型命中 framework_free_models 时：skip_bindings 内的"过程框架"绑定一律跳过
# （不探测、不引导安装），对应节点以 native current-agent 由模型直接执行——这是该模式下
# 的正式登记方式，不算降级兜底（SKILL.md 铁律 8 的唯一例外）。
# 编排流程本身不变：五维评分、节点集、Gate、出口门、spec.md 单一事实源与写入义务照旧，
# 只换"节点由谁执行"。检测与呈现规则见 SKILL.md Step 3「模型直通检测」。
model_overrides:
  framework_free_models: [gpt-5.6-sol]
  framework_free:
    # 跳过的绑定：superpowers 全家 + 同类 spec/TDD/计划过程框架
    skip_bindings:
      - "superpowers:*"               # CC 侧 superpowers 命名空间全部
      # Codex 侧 superpowers 裸名
      - writing-plans
      - test-driven-development
      - using-git-worktrees
      - executing-plans
      - subagent-driven-development
      - requesting-code-review
      - verification-before-completion
      - systematic-debugging
      - brainstorming
      # 同类过程框架（spec / 计划 / TDD 脚手架）
      - tdd
      - tdd-guard
      - taskmaster
      - openspec
      - openspec-propose
      - openspec-apply-change
      - openspec-archive-change
      - openspec-sync-specs
      - sdd-development
      - planning-with-files
    # 不受影响的绑定（能力/交互类，非过程脚手架）：
    # grill-me / grill-with-docs / diagnose（交互拷问与诊断）、Explore / codebase-analyzer（范围发现）、
    # code-review / security-review / simplify / verify / init 等执行器原生技能——照常探测绑定。
    effect: native_current_agent      # 命中节点视为 native_current_agent_allowed=true；出口门与 spec.md 写入义务不变

installables:
  openspec:
    type: tool
    verify_before_install: true
    install_ref: references/install.md#openspec
  taskmaster:
    type: tool
    verify_before_install: true
    install_ref: references/install.md#taskmaster
  tdd-guard:
    type: tool
    verify_before_install: true
    install_ref: references/install.md#tdd-guard
  missing-skill:
    type: skill
    verify_before_install: true
    install_ref: references/install.md#missing-skill

nodes:

  N0_project_base:
    stage: 项目底座
    produces: [AGENTS.md/CLAUDE.md 种子, docs/STANDARDS, docs/COMMANDS]
    exit_gate: 标准与命令齐
    missing_policy: install_or_adjust_plan
    subagent:
      supported: false
      native_current_agent_allowed: true
    invocations:
      - { env: claude-code, kind: skill, name: init, install: missing-skill }

  NS_scope_discovery:
    stage: 跨服务/跨仓范围发现
    # 老项目强制：当前仓常只是功能的一部分，必须先发现关联前后端/服务，否则 spec 只覆盖半边。
    # NS-A（Recon）由 advisor 自读；NS-B（Scope）派子代理执行。
    sub_steps:
      NS_A_recon:
        label: 意图侦察（Recon）
        model_tier: advisor
        reads: [README, "CLAUDE.md/AGENTS.md", CONTEXT.md, DESIGN.md, PRODUCT.md, "ADR/", git-log-30]
        produces: [项目意图与约束章节]
        executor: current-agent   # advisor 自读，不派子代理
      NS_B_scope:
        label: 跨服务范围发现（Scope）
        model_tier: advisor
        produces: [涉及服务/仓清单]
        executor: subagent        # 默认派子代理。CC 绑 Explore(agent kind)→必子代理；Codex 绑 codebase-analyzer(skill kind)→用户可在 Gate1 选当前 agent 调该 skill。下方 subagent.choice 仅在 binding 为 skill 时才有实际意义。
    produces: [涉及服务/仓清单, 关联 API/配置/DB/Apollo/回调链, 各服务改动面]
    exit_gate: 跨栈范围界定并经用户确认（greenfield 无既有服务标 N/A）
    missing_policy: install_or_adjust_plan
    subagent:
      supported: true
      choice_required: true
      role: explorer
      use_when: "老项目；当前路径只是功能一部分，需跨仓发现关联前端/后端/服务/API/DB"
      current_agent_allowed: true
      native_current_agent_allowed: false
      native_subagent_allowed: false
    invocations:
      - { env: claude-code, kind: agent, name: Explore, role: cross_service_scan, install: missing-skill }
      - { env: codex, kind: skill, name: codebase-analyzer, role: cross_service_scan, install: missing-skill }

  N1_grill:
    stage: 需求拷问 / 缺陷诊断
    flavor_rule: "任务类型=bugfix→诊断流(systematic-debugging；需全环插桩时改用 diagnose，二选一不并跑)；否则：有码库→grill-with-docs；无码库→grill-me；greenfield 需求发散可辅以 brainstorming"
    produces: [问题与非目标, 失败路径, 验收草案, goal_condition更新记录, "复现步骤与根因（bugfix 必填）"]
    goal_condition_sync_required: true
    interactive_protocol: one_question_at_a_time   # 协议详情见 SKILL.md「N1 拷问执行协议」：逐问、附推荐答案、无问题数上限、问到无未决分支
    exit_gate: 真实意图被逼出（未决分支清单=空） + goal_condition 已同步（进入 N3 或 N5 前）
    missing_policy: install_or_adjust_plan
    subagent:
      supported: false
      reason: "grill 拷问是与用户的一问一答交互，子代理无法与用户对话——派发即退化为自问自答、用户收到的问题数归零。需要并行代码扫描时用下方 auxiliary codebase-analyzer，不得替代拷问本身。"
      native_current_agent_allowed: false
    invocations:
      - { env: claude-code, kind: skill, name: "superpowers:systematic-debugging", condition: "任务类型=bugfix（复现→根因先行，未定位根因禁提修复）", install: missing-skill }
      - { env: codex, kind: skill, name: systematic-debugging, condition: "任务类型=bugfix", install: missing-skill }
      - { env: claude-code, kind: skill, name: diagnose, condition: "任务类型=bugfix 且需全环诊断（复现→最小化→插桩→回归）", auxiliary: true, install: missing-skill }
      - { env: any, kind: skill, name: grill-with-docs, condition: brownfield, install: missing-skill }
      - { env: any, kind: skill, name: grill-me, condition: greenfield, install: missing-skill }
      - { env: codex, kind: skill, name: codebase-analyzer, role: context_scan, auxiliary: true, install: missing-skill }
      - { env: claude-code, kind: skill, name: "superpowers:brainstorming", condition: "greenfield 需求发散", auxiliary: true, install: missing-skill }

  N2_domain:
    stage: 领域建模
    produces: [领域词表/UBIQUITOUS_LANGUAGE]
    exit_gate: 词汇人机一致
    missing_policy: install_or_adjust_plan
    subagent:
      supported: true
      choice_required: true
      role: explorer
      use_when: "术语跨多个模块或需要并行提取代码中的领域语言（subagent 仅承担词表提取扫描；与用户的术语对齐问答必须在当前 agent 进行）"
      current_agent_allowed: true
      native_current_agent_allowed: false
      native_subagent_allowed: false
    invocations:
      - { env: any, kind: skill, name: grill-with-docs, install: missing-skill }
      - { env: codex, kind: skill, name: codebase-analyzer, role: domain_scan, auxiliary: true, install: missing-skill }

  N3_spec:
    stage: 规格
    # CC 无 sdd-development（codex-only）时，OpenSpec 作为 env:any 主绑定承接全规模（含 H）。
    # CC 侧装有 OpenSpec skill 套件（openspec-propose 等）时，skill 形态优先于裸 CLI。
    flavor_rule: "CC 有 openspec-propose skill→优先之；规模L/M→OpenSpec；规模H/新项目→sdd-development(codex)，CC 无 sdd 时 OpenSpec(env:any) 承全规模含 H；风险H→对抗审查"
    acceptance_criteria_format: "推荐 EARS 格式，骨架见 spec-template 验收标准章节"
    produces: [需求, 数据模型/API/UI/兼容/权限, 验收标准, 测试策略]
    exit_gate: 关键闸·定稿
    missing_policy: install_or_adjust_plan
    subagent:
      supported: true
      choice_required: true
      role: explorer
      use_when: "需要独立规格审查、反向质疑或把规格编写与本地代码阅读并行"
      current_agent_allowed: true
      native_current_agent_allowed: false
      native_subagent_allowed: false
    invocations:
      - { env: claude-code, kind: skill, name: openspec-propose, condition: "OpenSpec 已安装并 init（skill 形态，优先于裸 CLI）", install: openspec }
      - { env: codex, kind: skill, name: sdd-development, condition: "规模H或新项目", install: missing-skill }
      - { env: any, kind: tool, name: openspec, condition: "全规模（规模H 且无 sdd 时由 OpenSpec 承接，见 flavor_rule）", install: openspec }
      - { env: any, kind: skill, name: requesting-code-review, condition: "风险H规格审查", auxiliary: true, install: missing-skill }
      - { env: claude-code, kind: skill, name: to-prd, condition: "产出 PRD 并发布到 issue tracker", auxiliary: true, install: missing-skill }

  N4_tasks:
    stage: 任务拆解
    done_criteria_requirement: transcript_verifiable
    # Done 标准必须 transcript-verifiable：验证命令将在 N5 中被执行并打印到对话；
    # Claude Code /goal 评估器（Haiku）只读 transcript，不能独立调工具。
    # 不可写语义判断类条件（"实现符合设计原则"）。
    model_tier: flexible
    executor_model:
      default: tier_high        # 跟随 advisor；规格清晰时可在 Gate 1 降
      when_spec_clear: tier_mid
    flavor_rule: "默认→writing-plans；仅用户明确要求时→Taskmaster；issue tracker 化→to-issues"
    produces: [tasks（大则裂变 tasks.md）]
    exit_gate: 每个任务含文件路径+摘录/scope边界/验证命令+期望输出/Done标准(transcript-verifiable)/逃生口
    missing_policy: install_or_adjust_plan
    subagent:
      supported: true
      choice_required: true
      role: explorer
      use_when: "任务可按模块拆分，适合让子代理生成独立任务切片"
      current_agent_allowed: true
      native_current_agent_allowed: false
      native_subagent_allowed: false
    invocations:
      - { env: claude-code, kind: skill, name: "superpowers:writing-plans", install: missing-skill }
      - { env: codex, kind: skill, name: planning-with-files, install: missing-skill }
      - { env: codex, kind: skill, name: writing-plans, install: missing-skill }
      - { env: any, kind: tool, name: taskmaster, condition: "仅用户明确要求使用 Taskmaster 时", install: taskmaster }
      - { env: claude-code, kind: skill, name: to-issues, condition: "拆成 issue tracker 条目", auxiliary: true, install: missing-skill }

  N5_implement:
    stage: 实现
    goal_integration:
      opt_in: true            # N5 前询问用户是否启用 /goal；不强制
      ask_timing: before_N5_after_N4
      condition_source: "N4 任务拆解产出的 Done 标准字段；若本轮未运行 N4，则使用 N1 同步后的 front-matter goal_condition"
      max_chars: 4000
      overflow_policy: split_or_ask_user
      invocation:
        # 机制单一事实源在 SKILL.md「N5 /goal 集成」；此处仅存机器可读枚举。
        mechanism: user_types_command   # /goal 是编译进 CLI 的内置命令，模型/Skill 工具均无法代为执行
        headless_alternative: "claude -p \"/goal <条件>\""   # 适用条件见 SKILL.md N5 /goal 集成
      modes:
        current-agent: supported     # /goal 作用于当前会话；评估器读主会话 transcript
        subagent: unsupported        # Task 子代理无法运行内置命令；替代流程见 SKILL.md N5 /goal 集成 §3
      evaluator:
        claude-code:
          type: external      # 独立评估器，执行者与裁判分离，质量保证更强
          model: small-fast-model   # 默认 Haiku；在 model-config 调整，或自写 prompt-based Stop hook 替代
          reads: transcript_only    # 不调工具，只读对话记录
          requires: "Claude Code ≥ 2.1.139；工作区已通过信任对话框；未设置 disableAllHooks"
          customizable: true
        codex:
          type: self_evaluating   # Codex Goals 是提示范式：可测量终止条件写进任务指令，自我评估，无独立裁判
          note: "自我评估偏乐观；条件须更加明确可量化"
    model_tier: executor
    executor_model:
      default: tier_mid         # 廉价模型执行实现
      risk_H: tier_high         # 风险H时升格，防止实现偷懒
    flavor_rule: "默认 TDD + worktree；风险H→TDD Guard；多独立任务可选 subagent（executing-plans/subagent-driven-development）"
    produces: [实现+测试, 状态]
    exit_gate: 红绿重构走完
    invalidates_on_rerun: [N6_review, N7_verify]
    missing_policy: install_or_adjust_plan
    subagent:
      supported: true
      choice_required: true
      role: worker
      use_when: "任务可拆成互不重叠的文件/模块写入范围"
      current_agent_allowed: true
      native_current_agent_allowed: false
      native_subagent_allowed: false
      requires_disjoint_write_sets: true
    invocations:
      - { env: claude-code, kind: skill, name: "superpowers:test-driven-development", install: missing-skill }
      - { env: claude-code, kind: skill, name: "superpowers:using-git-worktrees", auxiliary: true, install: missing-skill }
      - { env: claude-code, kind: skill, name: tdd, install: missing-skill }
      - { env: codex, kind: skill, name: test-driven-development, install: missing-skill }
      - { env: codex, kind: skill, name: using-git-worktrees, auxiliary: true, install: missing-skill }
      - { env: any, kind: tool, name: tdd-guard, condition: "风险H", install: tdd-guard }
      - { env: claude-code, kind: skill, name: "superpowers:executing-plans", condition: "已有书面计划、分会话执行", auxiliary: true, install: missing-skill }
      - { env: claude-code, kind: skill, name: "superpowers:subagent-driven-development", condition: "独立任务派子代理执行", auxiliary: true, install: missing-skill }
      - { env: claude-code, kind: skill, name: openspec-apply-change, condition: "N3 用 OpenSpec 产出 change 时按其 tasks 实施", auxiliary: true, install: openspec }

  N6_review:
    stage: 审查
    flavor_rule: "默认 code-review / requesting-code-review；风险H 或 任务类型=security→加挂 security-review；任务类型=refactor→加挂 simplify；风险H→对抗审查"
    produces: [审查记录]
    exit_gate: 关键闸·审查（每条finding已vet，by-design/误归因/重复已过滤，附核实证据）
    missing_policy: install_or_adjust_plan
    subagent:
      supported: true
      choice_required: true
      role: explorer
      use_when: "需要独立上下文审查 diff/spec，尤其是风险H或合并前"
      fork_hint: "CC 选 subagent 时优先 fork 型——审查不丢实现语境（fork 通用特性见 execution_modes 注释）"
      current_agent_allowed: true
      native_current_agent_allowed: true
      native_subagent_allowed: true
    invocations:
      - { env: claude-code, kind: skill, name: "superpowers:requesting-code-review", install: missing-skill }
      - { env: claude-code, kind: skill, name: code-review, install: missing-skill }
      - { env: codex, kind: skill, name: requesting-code-review, install: missing-skill }
      - { env: claude-code, kind: skill, name: security-review, condition: "风险H 或 任务类型=security", auxiliary: true, install: missing-skill }
      - { env: claude-code, kind: skill, name: simplify, condition: "任务类型=refactor 的质量清理（不猎 bug）", auxiliary: true, install: missing-skill }

  N7_verify:
    stage: 验证
    post_implementation_review:
      when_selected: N6_review
      requires_after_last_run: N6_review
    coverage_accounting:
      required: true
      cheapest_first_order: [unit_tests, lint, typecheck, build, goal_condition]
      checks:
        - intent_to_spec:  "N1 逼出意图 → spec 章节存在"
        - spec_to_test:    "spec 验收标准 → N7 验证命令存在"
        - goal_condition:  "front-matter goal_condition 最终验收"
    produces: [验证记录(DoD)]
    exit_gate: DoD 全项已解决（✅通过 或 ⏭️BLOCKED+已豁免，不允许留空/❌未解决）+ goal_condition 成立（非空未豁免时必须验证）+ 意图覆盖率追踪完整
    failure_policy:
      implementation_gap: 重跑 N5；若编排含 N6，则 N5 后必须重走 N6，再回 N7
      spec_or_task_gap: 回退 N3/N4，重新定稿并刷新 spec_commit，再跑 N5/N6/N7
    missing_policy: install_or_adjust_plan
    subagent:
      supported: false
      reason: "最终完成声明必须由当前 agent 读取验证输出后作出"
      # 末位兜底：verify 类推荐技能全缺时，允许当前 agent 直接跑 lint/test/build 并读输出。
      # 这不是内嵌方法兜底——验证本就是当前 agent 能直接执行的真实工作，借此消除永久 blocked 脆性。
      native_current_agent_allowed: true
    invocations:
      - { env: claude-code, kind: skill, name: "superpowers:verification-before-completion", install: missing-skill }
      - { env: claude-code, kind: skill, name: verify, install: missing-skill }
      - { env: codex, kind: skill, name: verification-before-completion, install: missing-skill }

  N8_archive:
    stage: 归档
    produces: [决策/被否方案/新领域词/遗留 TODO]
    exit_gate: 留痕完成
    missing_policy: install_or_adjust_plan
    subagent:
      supported: false
      # native current-agent 是 N8 的正式登记方式之一：归档写作（ADR/CONTEXT/spec 归档章节）
      # 本就是当前 agent 可直接执行的真实工作；下列 invocations 仅在 N3 用了 OpenSpec 时优先。
      native_current_agent_allowed: true
    invocations:
      - { env: claude-code, kind: skill, name: openspec-archive-change, condition: "N3 用 OpenSpec 产出 change，实施完成后归档", install: openspec }
      - { env: claude-code, kind: skill, name: openspec-sync-specs, condition: "/spec iterate：delta spec 回写主 spec（不归档 change）", install: openspec }
